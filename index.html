<!DOCTYPE html>
<html lang="en">

<style>
:root{--bg:#111113;--panel:#1c1c1f;--ink:#f2f2f2;--mut:#9a9a9f;--gold:#e6e6e6;--gold2:#ffffff;--rose:#e5484d;--line:#34343a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:500 15px/1.4 Manrope,system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 6px}
.brand{font:700 1.5rem/1 Manrope,system-ui,sans-serif;color:var(--ink)}
.brand small{display:block;font:500 .78rem Manrope,sans-serif;color:var(--mut);margin-top:3px;letter-spacing:.02em}
.stage{flex:1 1 auto;min-height:280px;margin:6px 12px;padding:6px;border-radius:22px;background:var(--line);display:flex;position:relative}
.stage .in{flex:1;background:#05030d;border-radius:17px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;position:relative}
canvas{max-width:100%;max-height:100%;touch-action:manipulation;cursor:crosshair}

.ov{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:10px;pointer-events:none}.ov button{pointer-events:auto;background:#000b;color:#fff;border-color:#ffffff55;padding:12px 18px;font-size:1rem}

.dock::-webkit-scrollbar{display:none}
button,.btn{font:700 .9rem Manrope,sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}

.card{flex:0 0 auto;width:92px;flex-direction:column;gap:0;padding:10px 6px;scroll-snap-align:start}
.card i{font:normal 600 1.6rem/1.2 system-ui,sans-serif;color:var(--ink)}
.card span{font-size:.78rem}
.card[aria-pressed=true]{border-color:var(--gold2);background:#2a2a2e}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;padding:6px 14px}
.pal{grid-column:1/-1;display:flex;gap:10px;align-items:center}
.sw{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid var(--line)}
.sw[aria-pressed=true]{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
label.r{display:flex;flex-direction:column;gap:4px;color:var(--mut);font-size:.82rem}
input[type=range]{width:100%;accent-color:var(--gold)}
.act{display:flex;gap:8px;padding:8px 12px 16px;flex-wrap:wrap}
.act>*{flex:1 1 auto}
.pri{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#2a1700;border:0}
.rec[aria-pressed=true]{background:var(--rose);border-color:var(--rose)}
input[type=file]{display:none}

#modal.on{display:flex}#modal img,#modal video{max-width:100%;max-height:70vh;border-radius:14px;border:3px solid var(--gold)}
#modal p{margin:0;color:var(--mut);text-align:center}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);padding:9px 16px;border-radius:12px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:10}
#toast.on{opacity:1}
@media (min-width:820px){.stage{margin:8px auto;width:min(1000px,94%)}.dock,.ctl,.act{max-width:1000px;width:100%;margin:0 auto}.dock{justify-content:center}}
body{font-family:Inter,-apple-system,'SF Pro Display','Segoe UI',system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:#11111399;border-bottom:1px solid #ffffff12}
.brand{font-weight:800;letter-spacing:-.03em;font-size:1.6rem;background:linear-gradient(90deg,#fff,#b8b8c0);-webkit-background-clip:text;background-clip:text;color:transparent}
.stage{background:linear-gradient(145deg,#ffffff30,#ffffff08);box-shadow:0 20px 60px #000a,0 0 0 1px #ffffff14;border-radius:26px}
.stage .in{border-radius:21px}
button,.btn{background:#ffffff0d;border:1px solid #ffffff1f;border-radius:16px;transition:transform .15s,background .2s}
button:active,.btn:active{transform:scale(.96)}
@media (hover:hover){button:hover,.btn:hover{background:#ffffff1a}}
.card{border-radius:18px;background:linear-gradient(160deg,#ffffff12,#ffffff05)}
.card[aria-pressed=true]{background:linear-gradient(160deg,#ffffff2e,#ffffff10);border-color:#fff;box-shadow:0 8px 24px #0008}
.card i{font-size:1.8rem;filter:drop-shadow(0 0 8px #ffffff55)}
.pri{background:linear-gradient(135deg,#fff,#cfd2dc);color:#111;border:0;box-shadow:0 6px 20px #ffffff22}
.ov button{background:#000a;border-radius:99px;padding:13px 22px}
.rec[aria-pressed=true]{background:var(--rose);border-color:var(--rose)}
@media (max-width:819px){.ctl{background:#ffffff08;border:1px solid #ffffff12;margin:6px 12px;border-radius:18px;padding:12px 14px}}
</style>
</head>
<body>
<header><div class="brand">Burst<small>Cracker photo studio</small></div><div style="display:flex;gap:6px"><button id="fz" aria-pressed="true">Fuse on</button><button id="snd" aria-pressed="true" aria-label="Toggle sound">Sound on</button></div></header>
<div class="stage"><div class="in"><canvas id="cv" width="1000" height="640"></canvas><div class="tip" id="tip">Tap the screen to launch</div><div class="ov"><button id="save">Screenshot</button><button class="rec" id="rec" aria-pressed="false">Record</button></div></div></div>
<div class="dock" id="dock" role="group" aria-label="Choose cracker"></div>
<div class="ctl">
 <div class="pal" id="pal" role="group" aria-label="Colour"></div>
 <label class="r">Size<input type="range" id="sz" min="60" max="160" value="100"></label>
 <label class="r">Night<input type="range" id="nt" min="0" max="85" value="0"></label>
</div>
<div class="act">
 <button class="pri" id="live">Live camera</button><button id="flip" style="display:none">Flip</button><label class="btn">Take photo<input type="file" id="cam" accept="image/*" capture="environment"></label>
 <label class="btn">Upload<input type="file" id="up" accept="image/*"></label>
 <button class="pri" id="fin">Grand finale</button>
 <button id="inst">Install app</button>
 <button id="clr">Reset</button>
</div>
<div id="modal"><div id="mc"></div><p id="mp"></p><button class="pri" id="mx">Close</button></div>
<div id="toast"></div>
<script>
(function(){
var $=function(s){return document.querySelector(s)};

var SW={auto:'conic-gradient(#ff4d7e,#ffd36b,#6fe3ff,#5dffb0,#a678ff,#ff4d7e)',gold:'#ffb02e',rose:'#ff4d7e',ice:'#6fe3ff',jade:'#5dffb0',royal:'#a678ff'};
var AUTO=['#ff4d7e','#ffd36b','#6fe3ff','#5dffb0','#a678ff','#ff8a3d','#ffffff'];

var AIR=['chrys','peony','willow','palm','ring','heart','cross','crackle','rocket','comet'];

function toast(m){var t=$('#toast');t.textContent=m;t.className='on';setTimeout(function(){t.className=''},2200)}
/* UI */

TYPES.forEach(function(t){var b=document.createElement('button');b.className='card';b.setAttribute('aria-pressed',t[0]===type);b.innerHTML='<i>'+t[2]+'</i><span>'+t[1]+'</span>';b.onclick=function(){type=t[0];[].forEach.call(dock.children,function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed','true')};dock.appendChild(b)});

$('#sz').oninput=function(e){size=e.target.value/100};
$('#nt').oninput=function(e){night=e.target.value/100};
$('#snd').onclick=function(e){muted=!muted;e.target.setAttribute('aria-pressed',!muted);e.target.textContent=muted?'Sound off':'Sound on'};
$('#clr').onclick=function(){camOff();parts=[];shells=[];emit=[];fl=[];demo();night=0;$('#nt').value=0};
/* Scene */
function setSize(w,h){W=cv.width=bg.width=w;H=cv.height=bg.height=h}
function demo(){setSize(1000,640);var g=bx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#000');g.addColorStop(.7,'#0a0f1f');g.addColorStop(1,'#1a2238');bx.fillStyle=g;bx.fillRect(0,0,W,H);

var x=0;while(x<W){var w=rnd(34,86),h=rnd(70,210);bx.fillStyle='#090516';bx.fillRect(x,H-h,w,h);for(var wy=H-h+12;wy<H-10;wy+=17)for(var wx=x+7;wx<x+w-9;wx+=14)if(Math.random()<.22){bx.fillStyle='rgba(255,196,96,.75)';bx.fillRect(wx,wy,5,7)}x+=w+rnd(0,6)}}
demo();
function load(f){if(!f)return;camOff();var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1100/Math.max(im.width,im.height));setSize(Math.round(im.width*s),Math.round(im.height*s));bx.drawImage(im,0,0,W,H);parts=[];shells=[];night=.45;$('#nt').value=45;toast('Photo ready. Tap to burst.')};im.src=r.result};r.readAsDataURL(f)}
var vid=document.createElement('video'),cam=null,facing='environment';vid.playsInline=true;vid.muted=true;
function camOff(){if(cam){cam.getTracks().forEach(function(t){t.stop()});cam=null;vid.srcObject=null}$('#live').textContent='Live camera';$('#flip').style.display='none'}
function camOn(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast('Live camera isn’t available here. Use Take photo.');return}
navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:false}).then(function(s){camOff();cam=s;vid.srcObject=s;return vid.play()}).then(function(){var vw=vid.videoWidth||1280,vh=vid.videoHeight||720,k=Math.min(1,1000/Math.max(vw,vh));setSize(Math.round(vw*k),Math.round(vh*k));parts=[];shells=[];night=0;$('#nt').value=0;$('#live').textContent='Stop camera';$('#flip').style.display='';$('#tip').style.opacity=1;toast('Camera on. Pick a cracker and tap.')}).catch(function(){camOff();toast('Camera blocked. Allow camera access, or use Take photo.')})}
$('#live').onclick=function(){if(cam)camOff();else camOn()};
$('#flip').onclick=function(){facing=facing=='user'?'environment':'user';camOn()};
$('#cam').onchange=function(e){load(e.target.files[0])};$('#up').onchange=function(e){load(e.target.files[0])};
/* Audio */
var ac,master,dest;
function audio(){if(ac)return;try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.8;master.connect(ac.destination);dest=ac.createMediaStreamDestination();master.connect(dest)}catch(e){}}
function noise(dur,f,vol,delay){if(!ac||muted)return;var n=ac.sampleRate*dur|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.2);var s=ac.createBufferSource();s.buffer=b;var q=ac.createBiquadFilter();q.type='lowpass';q.frequency.value=f;var g=ac.createGain();g.gain.value=vol;s.connect(q);q.connect(g);g.connect(master);s.start(ac.currentTime+(delay||0))}
function whistle(d){if(!ac||muted)return;var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='sine';o.frequency.setValueAtTime(600,t);o.frequency.exponentialRampToValueAtTime(2200,t+d);g.gain.setValueAtTime(.03,t);g.gain.linearRampToValueAtTime(0,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d)}
function boom(delay,k){noise(1.3,420,.9*Math.min(1.2,k),delay);noise(.18,5000,.35,delay)}
function crackle(delay){for(var i=0;i<16;i++)noise(.05,7000,.22,delay+rnd(0,.9))}
/* Physics */
function P(x,y,vx,vy,c,l,o){o=o||{};parts.push({x:x,y:y,px:x,py:y,vx:vx,vy:vy,c:c,l:l,m:l,g:o.g==null?.045:o.g,f:o.f||.985,w:o.w||1.8,tw:o.tw,sp:o.sp})}
function explode(x,y,t,k,delay){var c=pick(),c2=pick(),i,a,v,n;fl.push({x:x,y:y,r:150+110*k,a:.6,c:c});boom(delay||0,k);
switch(t){
case'peony':n=Math.round(130*k);for(i=0;i<n;i++){a=rnd(0,6.283);v=rnd(1,5.2)*k;P(x,y,Math.cos(a)*v,Math.sin(a)*v,i%3?c:c2,rnd(60,85),{w:2.2})}break;
case'chrys':n=Math.round(150*k);for(i=0;i<n;i++){a=rnd(0,6.283);v=rnd(2,5.6)*k;P(x,y,Math.cos(a)*v,Math.sin(a)*v,i%4?c:'#fff6d8',rnd(85,115),{w:1.6,f:.982,g:.03,tw:i%3==0})}break;
case'willow':n=Math.round(110*k);for(i=0;i<n;i++){a=rnd(0,6.283);v=rnd(1.4,4.2)*k;P(x,y,Math.cos(a)*v,Math.sin(a)*v,'#ffc65a',rnd(115,160),{w:1.5,f:.975,g:.06,tw:i%5==0})}break;
case'palm':for(var r=0;r<7;r++){var ba=r*.897+rnd(-.1,.1);for(i=0;i<16;i++){v=(1.2+i*.32)*k;P(x,y,Math.cos(ba)*v,Math.sin(ba)*v,i>10?c2:c,rnd(80,100),{w:2.8-i*.05,f:.985,g:.05})}}break;
case'ring':for(i=0;i<64;i++){a=i/64*6.283;P(x,y,Math.cos(a)*4.2*k,Math.sin(a)*4.2*k,c,rnd(70,80),{w:2.4,f:.98})}for(i=0;i<36;i++){a=i/36*6.283;P(x,y,Math.cos(a)*2.3*k,Math.sin(a)*2.3*k,c2,rnd(65,75),{w:2.2,f:.98})}break;

case'cross':n=Math.round(16*k)+6;for(i=0;i<n;i++){a=i/n*6.283;v=rnd(3,4.2)*k;P(x,y,Math.cos(a)*v,Math.sin(a)*v,c,rnd(34,44),{w:3,sp:1,f:.97})}break;
case'rocket':for(i=0;i<60;i++){a=rnd(0,6.283);v=rnd(1,3.6)*k;P(x,y,Math.cos(a)*v,Math.sin(a)*v,i%2?c:'#fff',rnd(40,60),{w:2,g:.05,tw:i%4==0})}break;case'comet':for(i=0;i<50;i++){a=rnd(0,6.283);v=rnd(.5,2.4)*k;P(x,y,Math.cos(a)*v,Math.sin(a)*v,'#ffe3a0',rnd(60,100),{w:1.4,g:.05,f:.98,tw:1})}break;case'crackle':crackle(delay||0);n=Math.round(100*k);for(i=0;i<n;i++){a=rnd(0,6.283);v=rnd(1,5)*k;P(x,y,Math.cos(a)*v,Math.sin(a)*v,'#fff',rnd(50,85),{w:1.8,tw:1,g:.04})}break}}
function ground(x,y,t){var k=size,i,a,v;
if(t=='bomb'){boom(0,1.5);fl.push({x:x,y:y,r:300,a:1,c:'#fff1c1'});for(i=0;i<90;i++){a=rnd(Math.PI,2*Math.PI);v=rnd(1,7)*k;P(x,y,Math.cos(a)*v*1.2,Math.sin(a)*v,i%3?'#ffb02e':'#fff',rnd(30,60),{w:2.2,g:.15,f:.97})}for(i=0;i<40;i++){a=i/40*6.283;P(x,y,Math.cos(a)*6*k,Math.sin(a)*1.2*k,'#fff',rnd(14,20),{w:3,g:0,f:.93})}return}
fl.push({x:x,y:y,r:120,a:.35,c:'#ffb02e'});if(t=='bijili')crackle(0);else noise(1.8,3500,.18,0);

var fuseOn=true,fuses=[];
function go(x,y,t){if(GROUND[t]){ground(x,y,t)}else if(t=='skyshot'){[0,1,2].forEach(function(n){launch(x+(n-1)*W*.12,y+Math.abs(n-1)*H*.06,['peony','ring','chrys'][n],size,n*16)})}else launch(x,y,t,size)}

$('#fz').onclick=function(e){fuseOn=!fuseOn;e.target.setAttribute('aria-pressed',fuseOn);e.target.textContent=fuseOn?'Fuse on':'Fuse off'};
cv.addEventListener('pointerdown',function(e){var r=cv.getBoundingClientRect();$('#tip').style.opacity=0;fire((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height)});

$('#fin').onclick=function(){if(fin)return;audio();fin=true;var n=30,i;for(i=0;i<n;i++)(function(i){setTimeout(function(){var t=AIR[Math.random()*AIR.length|0];if(i>=n-4){t='chrys'}launch(rnd(W*.1,W*.9),rnd(H*.12,H*.5),t,i>=n-4?1.5:rnd(.8,1.3))},i*i*3.6+i*90)})(i);setTimeout(function(){fin=false},9000)};
/* Output */
function show(el,msg){var m=$('#mc');m.innerHTML='';m.appendChild(el);$('#mp').textContent=msg;$('#modal').className='on'}
$('#mx').onclick=function(){$('#modal').className='';$('#mc').innerHTML=''};
$('#save').onclick=function(){var i=new Image();i.src=cv.toDataURL('image/png');i.alt='Your cracker photo';show(i,'Press and hold the image to save it to your phone.')};
var rec,chunks,rb=$('#rec');
if(typeof MediaRecorder==='undefined'||!cv.captureStream)rb.style.display='none';
